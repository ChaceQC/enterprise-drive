groups:
  - name: enterprise-drive-platform
    rules:
      - alert: EnterpriseDriveScrapeTargetDown
        expr: up{job=~"enterprise-drive-api|enterprise-drive-workers"} == 0
        for: 2m
        labels:
          severity: critical
          service: enterprise-drive
        annotations:
          summary: "企业网盘指标目标不可达"
          description: "组件 {{ $labels.component }} 已连续 2 分钟无法被 Prometheus 抓取。"

      - alert: EnterpriseDriveApiServerErrors
        expr: >-
          sum(rate(http_requests_total{status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: critical
          service: enterprise-drive
          component: api
        annotations:
          summary: "企业网盘 API 5xx 比例过高"
          description: "过去 10 分钟 API 5xx 比例持续超过 5%。"

      - alert: EnterpriseDriveApiLatencyHigh
        expr: >-
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
          service: enterprise-drive
          component: api
        annotations:
          summary: "企业网盘 API P95 延迟过高"
          description: "过去 10 分钟 API 请求 P95 延迟持续超过 1 秒。"

      - alert: EnterpriseDriveAccountLocksDetected
        expr: >-
          sum(increase(auth_security_events_total{
            event="account_lock",
            outcome="created"
          }[15m])) > 0
        for: 0m
        labels:
          severity: warning
          service: enterprise-drive
          component: auth
        annotations:
          summary: "企业网盘出现账号锁定"
          description: "最近 15 分钟检测到账号因连续登录失败被锁定，请检查来源与验证码状态。"

      - alert: EnterpriseDriveIdentityProviderFailures
        expr: >-
          sum by (provider_type, operation) (
            increase(identity_provider_operations_total{outcome="failure"}[15m])
          ) > 0
        for: 5m
        labels:
          severity: warning
          service: enterprise-drive
          component: identity
        annotations:
          summary: "企业身份提供商操作失败"
          description: "{{ $labels.provider_type }} 的 {{ $labels.operation }} 操作在最近 15 分钟持续失败。"

      - alert: EnterpriseDriveLdapSyncFailures
        expr: >-
          sum by (mode) (
            increase(ldap_sync_runs_total{outcome="failure"}[15m])
          ) > 0
        for: 0m
        labels:
          severity: warning
          service: enterprise-drive
          component: identity
        annotations:
          summary: "LDAP 同步运行失败"
          description: "LDAP {{ $labels.mode }} 同步在最近 15 分钟出现失败，请检查 Worker 日志和同步记录。"

      - alert: EnterpriseDriveOutboxDeadEvents
        expr: outbox_pending_total{status="dead"} > 0
        for: 5m
        labels:
          severity: critical
          service: enterprise-drive
          component: outbox
        annotations:
          summary: "企业网盘 Outbox 存在 dead 事件"
          description: "Outbox dead 事件持续存在，需要检查失败分类和人工重放流程。"

      - alert: EnterpriseDriveOutboxBacklog
        expr: sum(outbox_pending_total{status=~"pending|failed|processing"}) > 1000
        for: 15m
        labels:
          severity: warning
          service: enterprise-drive
          component: outbox
        annotations:
          summary: "企业网盘 Outbox 积压"
          description: "待处理、失败或处理中事件合计持续超过 1000。"

      - alert: EnterpriseDriveSearchIndexLag
        expr: search_index_lag_seconds > 300
        for: 10m
        labels:
          severity: warning
          service: enterprise-drive
          component: search
        annotations:
          summary: "企业网盘搜索索引延迟"
          description: "搜索索引待处理事件最大延迟持续超过 5 分钟。"

      - alert: EnterpriseDriveWorkerFailures
        expr: sum by (queue) (increase(worker_tasks_total{status!="success"}[15m])) > 0
        for: 0m
        labels:
          severity: warning
          service: enterprise-drive
          component: worker
        annotations:
          summary: "企业网盘 Worker 任务失败"
          description: "队列 {{ $labels.queue }} 在最近 15 分钟出现失败任务。"

      - alert: EnterpriseDrivePrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
          service: enterprise-drive
          component: prometheus
        annotations:
          summary: "Prometheus 告警规则计算失败"
          description: "最近 15 分钟出现 Prometheus rule evaluation failure。"
