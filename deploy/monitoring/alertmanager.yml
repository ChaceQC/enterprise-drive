global:
  resolve_timeout: 5m

route:
  receiver: enterprise-drive-operations
  group_by:
    - alertname
    - severity
    - component
    - task
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      group_wait: 10s
      repeat_interval: 30m

receivers:
  - name: enterprise-drive-operations
    webhook_configs:
      - url_file: /run/secrets/alertmanager-webhook-url
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - component
      - task
