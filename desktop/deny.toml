[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2025-0075", reason = "Tauri 2.11.5 transitive dependency; no safe upstream upgrade is available" },
  { id = "RUSTSEC-2025-0080", reason = "Tauri 2.11.5 transitive dependency; no safe upstream upgrade is available" },
  { id = "RUSTSEC-2025-0081", reason = "Tauri 2.11.5 transitive dependency; no safe upstream upgrade is available" },
  { id = "RUSTSEC-2025-0098", reason = "Tauri 2.11.5 transitive dependency; no safe upstream upgrade is available" },
  { id = "RUSTSEC-2025-0100", reason = "Tauri 2.11.5 transitive dependency; no safe upstream upgrade is available" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
