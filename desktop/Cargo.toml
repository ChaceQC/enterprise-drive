[workspace]
members = [
  "apps/drive-desktop/src-tauri",
  "crates/drive-api-client",
  "crates/drive-device-session",
  "crates/drive-sync-engine",
  "crates/drive-local-index",
  "crates/drive-transfer",
  "crates/drive-platform",
  "crates/drive-diagnostics",
  "crates/drive-update",
]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
authors = ["ChaceQC"]

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
ed25519-dalek = "2.2.0"
futures-util = "0.3.33"
globset = "0.4.19"
hex = "0.4.3"
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
notify = "8.2.0"
parking_lot = "0.12.5"
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "query",
  "rustls",
  "stream",
] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-build = "2.6.3"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
  "fs",
  "io-util",
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
url = { version = "2.5.7", features = ["serde"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
walkdir = "2.5.0"
windows-sys = "0.61.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
