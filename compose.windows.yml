name: ${COMPOSE_PROJECT_NAME:-enterprise-drive-windows}

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-5}"

x-app-environment: &app-environment
  TZ: UTC
  DRIVE_ENVIRONMENT: "${DRIVE_ENVIRONMENT:-production}"
  DRIVE_DEBUG: "${DRIVE_DEBUG:-false}"
  DRIVE_APP_PORT: "18080"
  DRIVE_SERVICE_NAME: "${DRIVE_SERVICE_NAME:-enterprise-drive-api}"
  DRIVE_SECRET_KEY: "${DRIVE_SECRET_KEY:?Set DRIVE_SECRET_KEY in .env.windows}"
  DRIVE_LOG_LEVEL: "${DRIVE_LOG_LEVEL:-INFO}"
  DRIVE_METRICS_DATABASE_REFRESH_ENABLED: "${DRIVE_METRICS_DATABASE_REFRESH_ENABLED:-true}"
  DRIVE_METRICS_DATABASE_REFRESH_TIMEOUT_SECONDS: "${DRIVE_METRICS_DATABASE_REFRESH_TIMEOUT_SECONDS:-1.0}"
  DRIVE_TRACING_ENABLED: "${DRIVE_TRACING_ENABLED:-true}"
  DRIVE_TRACING_SAMPLE_RATIO: "${DRIVE_TRACING_SAMPLE_RATIO:-0.1}"
  DRIVE_TRACING_EXPORTER: "${DRIVE_TRACING_EXPORTER:-none}"
  DRIVE_TRACING_OTLP_ENDPOINT: "${DRIVE_TRACING_OTLP_ENDPOINT:-}"
  DRIVE_TRACING_OTLP_HEADERS: "${DRIVE_TRACING_OTLP_HEADERS:-{}}"
  DRIVE_TRACING_EXPORT_TIMEOUT_SECONDS: "${DRIVE_TRACING_EXPORT_TIMEOUT_SECONDS:-10.0}"
  PROMETHEUS_MULTIPROC_DIR: /tmp/enterprise-drive/prometheus
  DRIVE_WORKER_METRICS_PORT: "0"
  DRIVE_DATABASE_URL: "${DRIVE_DATABASE_URL:?Set DRIVE_DATABASE_URL in .env.windows}"
  DRIVE_DATABASE_POOL_MODE: "${DRIVE_DATABASE_POOL_MODE:-queue}"
  DRIVE_DATABASE_POOL_SIZE: "${DRIVE_DATABASE_POOL_SIZE:-3}"
  DRIVE_DATABASE_MAX_OVERFLOW: "${DRIVE_DATABASE_MAX_OVERFLOW:-2}"
  DRIVE_DATABASE_POOL_TIMEOUT_SECONDS: "${DRIVE_DATABASE_POOL_TIMEOUT_SECONDS:-10}"
  DRIVE_REDIS_URL: "${DRIVE_REDIS_URL:?Set DRIVE_REDIS_URL in .env.windows}"
  DRIVE_S3_ENDPOINT_URL: "${DRIVE_S3_ENDPOINT_URL:-http://minio:9000}"
  DRIVE_S3_PUBLIC_ENDPOINT_URL: "${DRIVE_S3_PUBLIC_ENDPOINT_URL:?Set DRIVE_S3_PUBLIC_ENDPOINT_URL in .env.windows}"
  DRIVE_S3_BUCKET: "${DRIVE_S3_BUCKET:-enterprise-drive}"
  DRIVE_S3_ACCESS_KEY_ID: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.windows}"
  DRIVE_S3_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.windows}"
  DRIVE_S3_REGION: "${DRIVE_S3_REGION:-us-east-1}"
  DRIVE_OPENSEARCH_URL: "${DRIVE_OPENSEARCH_URL:-http://opensearch:9200}"
  DRIVE_OPENSEARCH_INDEX_NAME: "${DRIVE_OPENSEARCH_INDEX_NAME:-drive_files_v1}"
  DRIVE_CELERY_BROKER_URL: "${DRIVE_CELERY_BROKER_URL:?Set DRIVE_CELERY_BROKER_URL in .env.windows}"
  DRIVE_CELERY_RESULT_BACKEND: "${DRIVE_CELERY_RESULT_BACKEND:?Set DRIVE_CELERY_RESULT_BACKEND in .env.windows}"
  DRIVE_OUTBOX_DISPATCH_INTERVAL_SECONDS: "${DRIVE_OUTBOX_DISPATCH_INTERVAL_SECONDS:-5}"
  DRIVE_MAINTENANCE_TASK_BATCH_SIZE: "${DRIVE_MAINTENANCE_TASK_BATCH_SIZE:-100}"
  DRIVE_UPLOAD_CLEANUP_INTERVAL_SECONDS: "${DRIVE_UPLOAD_CLEANUP_INTERVAL_SECONDS:-300}"
  DRIVE_TRASH_RETENTION_DAYS: "${DRIVE_TRASH_RETENTION_DAYS:-30}"
  DRIVE_TRASH_CLEANUP_INTERVAL_SECONDS: "${DRIVE_TRASH_CLEANUP_INTERVAL_SECONDS:-3600}"
  DRIVE_BLOB_CLEANUP_INTERVAL_SECONDS: "${DRIVE_BLOB_CLEANUP_INTERVAL_SECONDS:-3600}"
  DRIVE_ORPHAN_OBJECT_SCAN_INTERVAL_SECONDS: "${DRIVE_ORPHAN_OBJECT_SCAN_INTERVAL_SECONDS:-86400}"
  DRIVE_QUOTA_RECONCILIATION_INTERVAL_SECONDS: "${DRIVE_QUOTA_RECONCILIATION_INTERVAL_SECONDS:-86400}"
  DRIVE_CORS_ORIGINS: "${DRIVE_CORS_ORIGINS:?Set DRIVE_CORS_ORIGINS in .env.windows}"
  DRIVE_TRUSTED_HOSTS: "${DRIVE_TRUSTED_HOSTS:?Set DRIVE_TRUSTED_HOSTS in .env.windows}"
  DRIVE_SESSION_COOKIE_SECURE: "${DRIVE_SESSION_COOKIE_SECURE:-false}"
  DRIVE_SESSION_COOKIE_SAMESITE: "${DRIVE_SESSION_COOKIE_SAMESITE:-lax}"
  DRIVE_ADMIN_TENANT_SLUG: "${DRIVE_ADMIN_TENANT_SLUG:-default}"
  DRIVE_ADMIN_TENANT_NAME: "${DRIVE_ADMIN_TENANT_NAME:-默认企业}"
  DRIVE_ADMIN_USERNAME: "${DRIVE_ADMIN_USERNAME:-admin}"
  DRIVE_ADMIN_EMAIL: "${DRIVE_ADMIN_EMAIL:-admin@example.com}"
  DRIVE_ADMIN_PASSWORD: "${DRIVE_ADMIN_PASSWORD:?Set DRIVE_ADMIN_PASSWORD in .env.windows}"
  DRIVE_PREVIEW_OFFICE_COMMAND: soffice
  DRIVE_PREVIEW_PDF_COMMAND: pdftoppm
  DRIVE_PREVIEW_OFFICE_MAX_PDF_BYTES: "${DRIVE_PREVIEW_OFFICE_MAX_PDF_BYTES:-52428800}"
  DRIVE_PREVIEW_PDF_DPI: "${DRIVE_PREVIEW_PDF_DPI:-144}"
  DRIVE_PREVIEW_PDF_MAX_RENDERED_BYTES: "${DRIVE_PREVIEW_PDF_MAX_RENDERED_BYTES:-52428800}"
  DRIVE_PREVIEW_COMMAND_TIMEOUT_SECONDS: "${DRIVE_PREVIEW_COMMAND_TIMEOUT_SECONDS:-30}"
  DRIVE_PREVIEW_TASK_SOFT_TIME_LIMIT_SECONDS: "${DRIVE_PREVIEW_TASK_SOFT_TIME_LIMIT_SECONDS:-120}"
  DRIVE_PREVIEW_TASK_TIME_LIMIT_SECONDS: "${DRIVE_PREVIEW_TASK_TIME_LIMIT_SECONDS:-150}"
  DRIVE_PREVIEW_TASK_RATE_LIMIT: "${DRIVE_PREVIEW_TASK_RATE_LIMIT:-30/m}"
  TMPDIR: /tmp/enterprise-drive
  XDG_CACHE_HOME: /tmp/enterprise-drive/cache

x-runtime-build: &runtime-build
  context: ./backend
  dockerfile: Dockerfile
  target: runtime
  args:
    PYTHON_IMAGE: "${PYTHON_IMAGE:-python:3.12.10-slim-bookworm}"
    UV_VERSION: "${UV_VERSION:-0.11.7}"

x-preview-build: &preview-build
  context: ./backend
  dockerfile: Dockerfile
  target: preview
  args:
    PYTHON_IMAGE: "${PYTHON_IMAGE:-python:3.12.10-slim-bookworm}"
    UV_VERSION: "${UV_VERSION:-0.11.7}"

x-app-common: &app-common
  image: "enterprise-drive-backend:${DRIVE_IMAGE_TAG:-windows-local}"
  build: *runtime-build
  environment: *app-environment
  networks:
    - backend
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp/enterprise-drive:size=${APP_TMPFS_SIZE:-134217728},mode=1770,uid=10001,gid=10001
  logging: *json-logging

x-app-dependencies: &app-dependencies
  migration:
    condition: service_completed_successfully
  minio-init:
    condition: service_completed_successfully
  redis:
    condition: service_healthy
  opensearch:
    condition: service_healthy

services:
  gateway:
    image: "${NGINX_IMAGE:-nginx:1.27-alpine}"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DRIVE_SERVER_NAME: "${DRIVE_SERVER_NAME:-localhost}"
      DRIVE_STORAGE_SERVER_NAME: "${DRIVE_STORAGE_SERVER_NAME:-storage.localhost}"
      DRIVE_TLS_CERT_NAME: "${DRIVE_TLS_CERT_NAME:-enterprise-drive}"
      DRIVE_TLS_HSTS_MAX_AGE: "${DRIVE_TLS_HSTS_MAX_AGE:-31536000}"
      DRIVE_API_MAX_BODY_SIZE: "${DRIVE_API_MAX_BODY_SIZE:-16m}"
      DRIVE_PROXY_CONNECT_TIMEOUT: "${DRIVE_PROXY_CONNECT_TIMEOUT:-10s}"
      DRIVE_PROXY_READ_TIMEOUT: "${DRIVE_PROXY_READ_TIMEOUT:-300s}"
      DRIVE_PROXY_SEND_TIMEOUT: "${DRIVE_PROXY_SEND_TIMEOUT:-300s}"
    ports:
      - "${DRIVE_GATEWAY_BIND:-127.0.0.1}:${DRIVE_GATEWAY_PORT:-18080}:${DRIVE_GATEWAY_HTTP_CONTAINER_PORT:-8080}"
      - "${DRIVE_STORAGE_GATEWAY_BIND:-127.0.0.1}:${DRIVE_STORAGE_GATEWAY_PORT:-19000}:${DRIVE_GATEWAY_SECONDARY_CONTAINER_PORT:-9000}"
    volumes:
      - type: bind
        source: "${DRIVE_GATEWAY_TEMPLATE_PATH:-./deploy/windows/nginx/default.conf.template}"
        target: /etc/nginx/templates/default.conf.template
        read_only: true
      - type: volume
        source: tls-certificates
        target: /etc/letsencrypt
        read_only: true
      - type: volume
        source: tls-acme-webroot
        target: /var/www/certbot
        read_only: true
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/gateway-healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: "${GATEWAY_CPU_LIMIT:-0.50}"
    mem_limit: "${GATEWAY_MEMORY_LIMIT:-256m}"
    pids_limit: ${GATEWAY_PIDS_LIMIT:-128}
    logging: *json-logging

  certbot:
    image: "${CERTBOT_IMAGE:-certbot/certbot:v5.6.0}"
    profiles:
      - tls-tools
    restart: "no"
    volumes:
      - tls-certificates:/etc/letsencrypt
      - tls-acme-webroot:/var/www/certbot
      - tls-certbot-work:/var/lib/letsencrypt
      - tls-certbot-logs:/var/log/letsencrypt
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cpus: "${CERTBOT_CPU_LIMIT:-0.50}"
    mem_limit: "${CERTBOT_MEMORY_LIMIT:-256m}"
    pids_limit: ${CERTBOT_PIDS_LIMIT:-128}
    logging: *json-logging

  api:
    <<: *app-common
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "18080"
      - --workers
      - "${DRIVE_API_WORKERS:-2}"
      - --proxy-headers
      - --forwarded-allow-ips
      - "${DRIVE_FORWARDED_ALLOW_IPS:-*}"
      - --no-server-header
    expose:
      - "18080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          request = urllib.request.Request(
              "http://127.0.0.1:18080/readyz",
              headers={"Host": "${DRIVE_SERVER_NAME:-localhost}"},
          );
          urllib.request.urlopen(request, timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    cpus: "${API_CPU_LIMIT:-2.00}"
    mem_limit: "${API_MEMORY_LIMIT:-2g}"
    pids_limit: ${API_PIDS_LIMIT:-512}

  migration:
    <<: *app-common
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    cpus: "${MIGRATION_CPU_LIMIT:-1.00}"
    mem_limit: "${MIGRATION_MEMORY_LIMIT:-1g}"
    pids_limit: ${MIGRATION_PIDS_LIMIT:-256}

  seed:
    <<: *app-common
    restart: "no"
    depends_on:
      migration:
        condition: service_completed_successfully
    command: ["python", "-m", "scripts.seed_admin"]
    cpus: "${SEED_CPU_LIMIT:-1.00}"
    mem_limit: "${SEED_MEMORY_LIMIT:-1g}"
    pids_limit: ${SEED_PIDS_LIMIT:-256}

  worker-audit:
    <<: *app-common
    environment:
      <<: *app-environment
      DRIVE_SERVICE_NAME: "enterprise-drive-worker-audit"
      DRIVE_DATABASE_POOL_MODE: "null"
      DRIVE_WORKER_METRICS_PORT: "9100"
    restart: unless-stopped
    depends_on: *app-dependencies
    command:
      - celery
      - -A
      - app.infrastructure.queue.celery_app
      - worker
      - --queues=audit
      - --hostname=audit@%h
      - --loglevel=INFO
      - "--concurrency=${AUDIT_WORKER_CONCURRENCY:-2}"
      - "--max-tasks-per-child=${AUDIT_WORKER_MAX_TASKS_PER_CHILD:-500}"
    expose:
      - "9100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from pathlib import Path;
          command = Path("/proc/1/cmdline").read_bytes();
          raise SystemExit(0 if b"celery" in command and b"worker" in command else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: "${AUDIT_WORKER_CPU_LIMIT:-1.00}"
    mem_limit: "${AUDIT_WORKER_MEMORY_LIMIT:-1g}"
    pids_limit: ${AUDIT_WORKER_PIDS_LIMIT:-256}

  worker-permission:
    <<: *app-common
    environment:
      <<: *app-environment
      DRIVE_SERVICE_NAME: "enterprise-drive-worker-permission"
      DRIVE_DATABASE_POOL_MODE: "null"
      DRIVE_WORKER_METRICS_PORT: "9100"
    restart: unless-stopped
    depends_on: *app-dependencies
    command:
      - celery
      - -A
      - app.infrastructure.queue.celery_app
      - worker
      - --queues=permission
      - --hostname=permission@%h
      - --loglevel=INFO
      - "--concurrency=${PERMISSION_WORKER_CONCURRENCY:-2}"
      - "--max-tasks-per-child=${PERMISSION_WORKER_MAX_TASKS_PER_CHILD:-500}"
    expose:
      - "9100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from pathlib import Path;
          command = Path("/proc/1/cmdline").read_bytes();
          raise SystemExit(0 if b"celery" in command and b"worker" in command else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: "${PERMISSION_WORKER_CPU_LIMIT:-1.00}"
    mem_limit: "${PERMISSION_WORKER_MEMORY_LIMIT:-1g}"
    pids_limit: ${PERMISSION_WORKER_PIDS_LIMIT:-256}

  worker-search:
    <<: *app-common
    environment:
      <<: *app-environment
      DRIVE_SERVICE_NAME: "enterprise-drive-worker-search"
      DRIVE_DATABASE_POOL_MODE: "null"
      DRIVE_WORKER_METRICS_PORT: "9100"
    restart: unless-stopped
    depends_on: *app-dependencies
    command:
      - celery
      - -A
      - app.infrastructure.queue.celery_app
      - worker
      - --queues=search
      - --hostname=search@%h
      - --loglevel=INFO
      - "--concurrency=${SEARCH_WORKER_CONCURRENCY:-2}"
      - "--max-tasks-per-child=${SEARCH_WORKER_MAX_TASKS_PER_CHILD:-100}"
    expose:
      - "9100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from pathlib import Path;
          command = Path("/proc/1/cmdline").read_bytes();
          raise SystemExit(0 if b"celery" in command and b"worker" in command else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: "${SEARCH_WORKER_CPU_LIMIT:-2.00}"
    mem_limit: "${SEARCH_WORKER_MEMORY_LIMIT:-2g}"
    pids_limit: ${SEARCH_WORKER_PIDS_LIMIT:-384}

  worker-maintenance:
    <<: *app-common
    environment:
      <<: *app-environment
      DRIVE_SERVICE_NAME: "enterprise-drive-worker-maintenance"
      DRIVE_DATABASE_POOL_MODE: "null"
      DRIVE_WORKER_METRICS_PORT: "9100"
    restart: unless-stopped
    depends_on: *app-dependencies
    command:
      - celery
      - -A
      - app.infrastructure.queue.celery_app
      - worker
      - --queues=maintenance
      - --hostname=maintenance@%h
      - --loglevel=INFO
      - "--concurrency=${MAINTENANCE_WORKER_CONCURRENCY:-1}"
      - "--max-tasks-per-child=${MAINTENANCE_WORKER_MAX_TASKS_PER_CHILD:-50}"
    expose:
      - "9100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from pathlib import Path;
          command = Path("/proc/1/cmdline").read_bytes();
          raise SystemExit(0 if b"celery" in command and b"worker" in command else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: "${MAINTENANCE_WORKER_CPU_LIMIT:-1.50}"
    mem_limit: "${MAINTENANCE_WORKER_MEMORY_LIMIT:-2g}"
    pids_limit: ${MAINTENANCE_WORKER_PIDS_LIMIT:-384}

  worker-preview:
    <<: *app-common
    image: "enterprise-drive-preview:${DRIVE_IMAGE_TAG:-windows-local}"
    build: *preview-build
    environment:
      <<: *app-environment
      DRIVE_SERVICE_NAME: "enterprise-drive-worker-preview"
      DRIVE_DATABASE_POOL_MODE: "null"
      DRIVE_WORKER_METRICS_PORT: "9100"
    restart: unless-stopped
    depends_on: *app-dependencies
    tmpfs:
      - /tmp/enterprise-drive:size=${PREVIEW_TMPFS_SIZE:-1073741824},mode=1770,uid=10001,gid=10001
    command:
      - celery
      - -A
      - app.infrastructure.queue.celery_app
      - worker
      - --queues=preview
      - --hostname=preview@%h
      - --loglevel=INFO
      - "--concurrency=${PREVIEW_WORKER_CONCURRENCY:-1}"
      - "--max-tasks-per-child=${PREVIEW_WORKER_MAX_TASKS_PER_CHILD:-20}"
    expose:
      - "9100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from pathlib import Path;
          command = Path("/proc/1/cmdline").read_bytes();
          raise SystemExit(0 if b"celery" in command and b"worker" in command else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    cpus: "${PREVIEW_WORKER_CPU_LIMIT:-2.00}"
    mem_limit: "${PREVIEW_WORKER_MEMORY_LIMIT:-3g}"
    pids_limit: ${PREVIEW_WORKER_PIDS_LIMIT:-512}

  beat:
    <<: *app-common
    environment:
      <<: *app-environment
      DRIVE_SERVICE_NAME: "enterprise-drive-beat"
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command:
      - celery
      - -A
      - app.infrastructure.queue.celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/enterprise-drive/celerybeat-schedule
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from pathlib import Path;
          command = Path("/proc/1/cmdline").read_bytes();
          raise SystemExit(0 if b"celery" in command and b"beat" in command else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: "${BEAT_CPU_LIMIT:-0.50}"
    mem_limit: "${BEAT_MEMORY_LIMIT:-512m}"
    pids_limit: ${BEAT_PIDS_LIMIT:-128}

  postgres:
    image: "${POSTGRES_IMAGE:-postgres:16-bookworm}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-enterprise_drive}"
      POSTGRES_USER: "${POSTGRES_USER:-drive}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.windows}"
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: "${POSTGRES_SHM_SIZE:-256m}"
    cpus: "${POSTGRES_CPU_LIMIT:-2.00}"
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-2g}"
    pids_limit: ${POSTGRES_PIDS_LIMIT:-512}
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

  redis:
    image: "${REDIS_IMAGE:-redis:7.4-alpine}"
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.windows}"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.windows}"
      REDISCLI_AUTH: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.windows}"
      TZ: UTC
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    cpus: "${REDIS_CPU_LIMIT:-1.00}"
    mem_limit: "${REDIS_MEMORY_LIMIT:-1g}"
    pids_limit: ${REDIS_PIDS_LIMIT:-256}
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

  minio:
    image: "${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}"
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.windows}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.windows}"
      MINIO_BROWSER: "off"
      MINIO_API_CORS_ALLOW_ORIGIN: "${MINIO_CORS_ALLOWED_ORIGIN:-http://localhost:15173}"
      TZ: UTC
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    cpus: "${MINIO_CPU_LIMIT:-2.00}"
    mem_limit: "${MINIO_MEMORY_LIMIT:-2g}"
    pids_limit: ${MINIO_PIDS_LIMIT:-512}
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

  minio-init:
    image: "${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727}"
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.windows}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.windows}"
      MINIO_BUCKET: "${DRIVE_S3_BUCKET:-enterprise-drive}"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        mc mb --ignore-existing "local/$${MINIO_BUCKET}";
        mc anonymous set none "local/$${MINIO_BUCKET}"
    networks:
      - backend
    cpus: "${MINIO_INIT_CPU_LIMIT:-0.50}"
    mem_limit: "${MINIO_INIT_MEMORY_LIMIT:-256m}"
    pids_limit: ${MINIO_INIT_PIDS_LIMIT:-128}
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

  opensearch:
    image: "${OPENSEARCH_IMAGE:-opensearchproject/opensearch:2.17.1}"
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?Set OPENSEARCH_INITIAL_ADMIN_PASSWORD in .env.windows}"
      TZ: UTC
    expose:
      - "9200"
      - "9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s" >/dev/null
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    shm_size: "${OPENSEARCH_SHM_SIZE:-512m}"
    cpus: "${OPENSEARCH_CPU_LIMIT:-2.00}"
    mem_limit: "${OPENSEARCH_MEMORY_LIMIT:-3g}"
    pids_limit: ${OPENSEARCH_PIDS_LIMIT:-1024}
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  minio-data:
  opensearch-data:
  tls-certificates:
  tls-acme-webroot:
  tls-certbot-work:
  tls-certbot-logs:
