[project]
name = "enterprise-drive-backend"
version = "0.4.0"
description = "企业网盘后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "redis>=5.0",
  "argon2-cffi>=23.1",
  "celery[redis]>=5.4",
  "opensearch-py>=2.6",
  "opentelemetry-api>=1.26",
  "opentelemetry-exporter-otlp-proto-http>=1.26",
  "opentelemetry-instrumentation-celery>=0.47b0",
  "opentelemetry-sdk>=1.26",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
  "minio>=7.2.20",
  "pillow>=10",
  "prometheus-client>=0.21",
  "pypdf>=5.0",
  "python-docx>=1.2",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20",
  "factory-boy>=3.3",
  "httpx>=0.27",
  "locust>=2.37,<3",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "testcontainers>=4.7",
  "types-openpyxl>=3.1.5.20260518",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: tests that require external services such as MinIO",
]
