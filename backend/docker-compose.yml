name: enterprise-drive-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: enterprise_drive
      POSTGRES_USER: drive
      POSTGRES_PASSWORD: drive_dev_password
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drive -d enterprise_drive"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:4.40@sha256:52194fba4fecd0083c842158b3a902ba6e04a63619b2b0efcd08007bdb6a4602
    command:
      - mini
      - -dir=/data
      - -s3.port=9000
      - -s3.allowedOrigins=http://localhost:15173
      - -s3.iam=false
      - -s3.allowDeleteBucketNotEmpty=false
      - -s3.port.iceberg=0
      - -admin.ui=false
      - -webdav=false
      - -filer.exposeDirectoryData=false
      - -filer.disableDirListing=true
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: drive-dev
      AWS_SECRET_ACCESS_KEY: drive-dev-password
      S3_BUCKET: enterprise-drive
    ports:
      - "127.0.0.1:19000:9000"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Drive-dev-password-123!"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:19200:9200"
      - "127.0.0.1:19600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
  opensearch-data:
