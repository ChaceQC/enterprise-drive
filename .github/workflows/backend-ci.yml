name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - "compose.windows.yml"
      - ".env.windows.example"
      - "deploy/windows/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "compose.windows.yml"
      - ".env.windows.example"
      - "deploy/windows/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Start MinIO
        run: |
          MINIO_IMAGE="$(sed -n 's/^MINIO_IMAGE=//p' ../.env.windows.example)"
          test -n "${MINIO_IMAGE}"
          docker run -d --name enterprise-drive-ci-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=drive-dev \
            -e MINIO_ROOT_PASSWORD=drive-dev-password \
            "${MINIO_IMAGE}" server /data
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs enterprise-drive-ci-minio
          exit 1

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app

      - name: Pytest
        env:
          DRIVE_RUN_MINIO_TESTS: "1"
          DRIVE_TEST_MINIO_ENDPOINT: "http://127.0.0.1:9000"
          DRIVE_TEST_MINIO_ACCESS_KEY: "drive-dev"
          DRIVE_TEST_MINIO_SECRET_KEY: "drive-dev-password"
          DRIVE_TEST_MINIO_BUCKET: "enterprise-drive-ci"
        run: uv run pytest

      - name: Validate Windows Docker Compose
        working-directory: .
        run: docker compose --profile tls-tools --env-file .env.windows.example -f compose.windows.yml config --quiet

      - name: Validate public TLS Compose
        working-directory: .
        env:
          DRIVE_SERVER_NAME: drive.example.com
          DRIVE_STORAGE_SERVER_NAME: storage.example.com
          DRIVE_S3_PUBLIC_ENDPOINT_URL: https://storage.example.com
          DRIVE_SESSION_COOKIE_SECURE: "true"
          DRIVE_TRUSTED_HOSTS: '["drive.example.com","storage.example.com"]'
          DRIVE_CORS_ORIGINS: '["https://drive.example.com"]'
          MINIO_CORS_ALLOWED_ORIGIN: https://drive.example.com
          DRIVE_GATEWAY_TEMPLATE_PATH: ./deploy/windows/nginx/tls.conf.template
          DRIVE_GATEWAY_BIND: 0.0.0.0
          DRIVE_STORAGE_GATEWAY_BIND: 0.0.0.0
          DRIVE_GATEWAY_PORT: "80"
          DRIVE_STORAGE_GATEWAY_PORT: "443"
          DRIVE_GATEWAY_HTTP_CONTAINER_PORT: "8080"
          DRIVE_GATEWAY_SECONDARY_CONTAINER_PORT: "8443"
        run: docker compose --profile tls-tools --env-file .env.windows.example -f compose.windows.yml config --quiet

      - name: Validate Windows Compose backup model
        working-directory: .
        run: |
          set -euo pipefail
          docker compose \
            --profile tls-tools \
            --env-file .env.windows.example \
            -f compose.windows.yml \
            config --format json |
            python -c '
          import json
          import sys

          config = json.load(sys.stdin)
          services = config["services"]
          volumes = config["volumes"]
          project = config["name"]

          port_services = sorted(
              name for name, service in services.items() if service.get("ports")
          )
          assert port_services == ["gateway"], (
              f"Only gateway may publish host ports; found: {port_services}"
          )

          expected_volumes = {
              "postgres-data",
              "redis-data",
              "minio-data",
              "opensearch-data",
              "tls-certificates",
          }
          missing_volumes = sorted(expected_volumes - volumes.keys())
          assert not missing_volumes, (
              f"Missing backup volumes: {missing_volumes}"
          )
          for logical_name in sorted(expected_volumes):
              expected_name = f"{project}_{logical_name}"
              actual_name = volumes[logical_name].get("name")
              assert actual_name == expected_name, (
                  f"Volume {logical_name} resolved to {actual_name}, "
                  f"expected {expected_name}"
              )

          expected_mounts = {
              "postgres-data": {
                  ("postgres", "/var/lib/postgresql/data", False),
              },
              "redis-data": {
                  ("redis", "/data", False),
              },
              "minio-data": {
                  ("minio", "/data", False),
              },
              "opensearch-data": {
                  ("opensearch", "/usr/share/opensearch/data", False),
              },
              "tls-certificates": {
                  ("gateway", "/etc/letsencrypt", True),
                  ("certbot", "/etc/letsencrypt", False),
              },
          }
          for volume_name, expected in expected_mounts.items():
              actual = {
                  (
                      service_name,
                      mount.get("target"),
                      bool(mount.get("read_only", False)),
                  )
                  for service_name, service in services.items()
                  for mount in service.get("volumes", [])
                  if mount.get("type") == "volume"
                  and mount.get("source") == volume_name
              }
              assert actual == expected, (
                  f"Unexpected mounts for {volume_name}: "
                  f"{sorted(actual)}; expected {sorted(expected)}"
              )
          '

      - name: Validate Nginx gateway templates
        working-directory: .
        run: |
          set -euo pipefail
          tls_volume="enterprise-drive-ci-tls-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "${tls_volume}" >/dev/null
          trap 'docker volume rm -f "${tls_volume}" >/dev/null 2>&1 || true' EXIT

          docker run --rm \
            --mount "type=volume,source=${tls_volume},target=/etc/letsencrypt" \
            --entrypoint sh \
            certbot/certbot:v5.6.0 \
            -ec 'mkdir -p /etc/letsencrypt/live/enterprise-drive; openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=drive.example.com" -addext "subjectAltName=DNS:drive.example.com,DNS:storage.example.com" -keyout /etc/letsencrypt/live/enterprise-drive/privkey.pem -out /etc/letsencrypt/live/enterprise-drive/fullchain.pem >/dev/null 2>&1'

          docker run --rm \
            --add-host api:127.0.0.1 \
            --add-host minio:127.0.0.1 \
            --mount "type=bind,source=${PWD}/deploy/windows/nginx/tls.conf.template,target=/etc/nginx/templates/default.conf.template,readonly" \
            --mount "type=volume,source=${tls_volume},target=/etc/letsencrypt,readonly" \
            -e DRIVE_SERVER_NAME=drive.example.com \
            -e DRIVE_STORAGE_SERVER_NAME=storage.example.com \
            -e DRIVE_TLS_CERT_NAME=enterprise-drive \
            -e DRIVE_TLS_HSTS_MAX_AGE=31536000 \
            -e DRIVE_API_MAX_BODY_SIZE=16m \
            -e DRIVE_PROXY_CONNECT_TIMEOUT=10s \
            -e DRIVE_PROXY_READ_TIMEOUT=300s \
            -e DRIVE_PROXY_SEND_TIMEOUT=300s \
            nginx:1.27-alpine nginx -t

          docker run --rm \
            --mount "type=bind,source=${PWD}/deploy/windows/nginx/acme-bootstrap.conf.template,target=/etc/nginx/templates/default.conf.template,readonly" \
            -e DRIVE_SERVER_NAME=drive.example.com \
            -e DRIVE_STORAGE_SERVER_NAME=storage.example.com \
            nginx:1.27-alpine nginx -t
          test "$(grep -Fc 'location = /gateway-healthz {' deploy/windows/nginx/acme-bootstrap.conf.template)" -eq 2

      - name: Build API and core Worker image
        run: docker build --target runtime --tag enterprise-drive-backend:ci .

      - name: Build Preview Worker image
        run: docker build --target preview --tag enterprise-drive-preview:ci .

  minio-image-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify immutable MinIO image references
        id: images
        run: |
          set -euo pipefail
          files=(
            .env.windows.example
            compose.windows.yml
            backend/docker-compose.yml
            .github/workflows/backend-ci.yml
          )
          if grep -En 'minio/(minio|mc):latest([^[:alnum:]_.-]|$)' "${files[@]}"; then
            echo "Mutable MinIO image tag detected." >&2
            exit 1
          fi

          test "$(grep -c '^MINIO_IMAGE=' .env.windows.example)" -eq 1
          test "$(grep -c '^MINIO_MC_IMAGE=' .env.windows.example)" -eq 1
          server_image="$(sed -n 's/^MINIO_IMAGE=//p' .env.windows.example)"
          client_image="$(sed -n 's/^MINIO_MC_IMAGE=//p' .env.windows.example)"
          server_pattern='^minio/minio:RELEASE\.[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z@sha256:[0-9a-f]{64}$'
          client_pattern='^minio/mc:RELEASE\.[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z@sha256:[0-9a-f]{64}$'
          [[ "${server_image}" =~ ${server_pattern} ]]
          [[ "${client_image}" =~ ${client_pattern} ]]

          root_config="$(docker compose --profile tls-tools --env-file .env.windows.example -f compose.windows.yml config --format json)"
          test "$(jq -r '.services.minio.image' <<<"${root_config}")" = "${server_image}"
          test "$(jq -r '.services["minio-init"].image' <<<"${root_config}")" = "${client_image}"
          dev_config="$(docker compose -f backend/docker-compose.yml config --format json)"
          test "$(jq -r '.services.minio.image' <<<"${dev_config}")" = "${server_image}"

          verify_registry_digest() {
            local image="$1"
            local tag_reference="${image%@sha256:*}"
            local expected_digest="${image##*@}"
            local resolved_digest
            resolved_digest="$(
              docker buildx imagetools inspect "${tag_reference}" --format '{{json .Manifest}}' |
                jq -r '.digest'
            )"
            test "${resolved_digest}" = "${expected_digest}"
          }
          verify_registry_digest "${server_image}"
          verify_registry_digest "${client_image}"

          matrix="$(
            jq -cn \
              --arg server "${server_image}" \
              --arg client "${client_image}" \
              '{include: [
                {component: "server", image: $server},
                {component: "client", image: $client}
              ]}'
          )"
          echo "matrix=${matrix}" >>"${GITHUB_OUTPUT}"

  minio-supply-chain:
    needs: minio-image-policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.minio-image-policy.outputs.matrix) }}

    steps:
      - name: Prepare artifact directory
        run: mkdir -p supply-chain-artifacts

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ matrix.image }}
          format: spdx-json
          output-file: supply-chain-artifacts/minio-${{ matrix.component }}.spdx.json
          syft-version: v1.46.0
          dependency-snapshot: false
          upload-artifact: false

      - name: Generate full Grype vulnerability report
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: supply-chain-artifacts/minio-${{ matrix.component }}.spdx.json
          fail-build: false
          output-format: json
          output-file: supply-chain-artifacts/minio-${{ matrix.component }}.grype.json
          severity-cutoff: critical
          only-fixed: false
          grype-version: v0.115.0

      - name: Report baseline and gate newly discovered Critical vulnerabilities
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE: ${{ matrix.image }}
          REPORT: supply-chain-artifacts/minio-${{ matrix.component }}.grype.json
        run: |
          set -euo pipefail
          case "${COMPONENT}" in
            server)
              baseline=$'CVE-2026-10536\nCVE-2026-11856\nCVE-2026-8924\nCVE-2026-8927\nCVE-2026-9079\nGHSA-5cgq-3rg8-m6cv\nGHSA-5cx5-wh4m-82fh\nGHSA-89gr-r52h-f8rx\nGHSA-f5wc-c3c7-36mc\nGHSA-jppx-rxg9-jmrx\nGHSA-jv87-32hw-hh99\nGHSA-p77j-4mvh-x3m3\nGHSA-rm3j-f69w-wqmq\nGHSA-vgwf-h737-ff37\nGHSA-x527-x647-q7gg\nGO-2026-4337\nGO-2026-5005\nGO-2026-5019\nGO-2026-5020'
              ;;
            client)
              baseline=$'GHSA-5cgq-3rg8-m6cv\nGHSA-89gr-r52h-f8rx\nGHSA-f5wc-c3c7-36mc\nGHSA-jppx-rxg9-jmrx\nGHSA-p77j-4mvh-x3m3\nGHSA-rm3j-f69w-wqmq\nGHSA-vgwf-h737-ff37\nGHSA-x527-x647-q7gg\nGO-2026-4337\nGO-2026-5005\nGO-2026-5019\nGO-2026-5020'
              ;;
            *)
              echo "Unknown MinIO component: ${COMPONENT}" >&2
              exit 1
              ;;
          esac

          baseline_file="$(mktemp)"
          observed_file="$(mktemp)"
          new_file="$(mktemp)"
          trap 'rm -f "${baseline_file}" "${observed_file}" "${new_file}"' EXIT
          printf '%s\n' "${baseline}" | LC_ALL=C sort -u >"${baseline_file}"
          jq -r '
            .matches[]
            | select(.vulnerability.severity == "Critical")
            | .vulnerability.id
          ' "${REPORT}" | LC_ALL=C sort -u >"${observed_file}"
          comm -13 "${baseline_file}" "${observed_file}" >"${new_file}"

          baseline_count="$(wc -l <"${baseline_file}" | tr -d ' ')"
          critical_count="$(wc -l <"${observed_file}" | tr -d ' ')"
          new_count="$(wc -l <"${new_file}" | tr -d ' ')"
          {
            echo "### MinIO ${COMPONENT} supply-chain scan"
            echo
            echo "- Image: \`${IMAGE}\`"
            echo "- SBOM: SPDX JSON generated by Syft v1.46.0"
            echo "- Scanner: Grype v0.115.0"
            echo "- Audited Critical baseline (2026-07-15): ${baseline_count}"
            echo "- Current Critical IDs: ${critical_count}"
            echo "- Newly discovered Critical IDs: ${new_count}"
            echo
            echo "<details><summary>Current Critical vulnerability IDs</summary>"
            echo
            echo '```text'
            cat "${observed_file}"
            echo '```'
            echo "</details>"
          } >>"${GITHUB_STEP_SUMMARY}"

          if [[ -s "${new_file}" ]]; then
            echo "New Critical vulnerabilities were found:" >&2
            cat "${new_file}" >&2
            exit 1
          fi

      - name: Upload MinIO supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minio-${{ matrix.component }}-supply-chain
          path: supply-chain-artifacts/
          if-no-files-found: error

  windows-deployment:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Windows PowerShell management entrypoint
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $PowerShellFiles = @(
              Get-ChildItem `
                  -LiteralPath ".\deploy\windows" `
                  -Filter "*.ps1" `
                  -Recurse `
                  -File
          )
          if ($PowerShellFiles.Count -eq 0) {
              throw "No deploy/windows PowerShell files were found"
          }

          foreach ($PowerShellFile in $PowerShellFiles) {
              $Bytes = [System.IO.File]::ReadAllBytes($PowerShellFile.FullName)
              if (
                  $Bytes.Length -ge 3 -and
                  $Bytes[0] -eq 0xEF -and
                  $Bytes[1] -eq 0xBB -and
                  $Bytes[2] -eq 0xBF
              ) {
                  throw "PowerShell file must not use a UTF-8 BOM: $($PowerShellFile.FullName)"
              }
              foreach ($Byte in $Bytes) {
                  if ($Byte -gt 0x7F) {
                      throw "PowerShell file must remain ASCII: $($PowerShellFile.FullName)"
                  }
              }

              $Errors = $null
              $Tokens = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $PowerShellFile.FullName,
                  [ref]$Tokens,
                  [ref]$Errors
              ) | Out-Null
              if ($Errors.Count -gt 0) {
                  $Errors | Format-List
                  throw "PowerShell 5.1 parser validation failed: $($PowerShellFile.FullName)"
              }
          }

      - name: Run Windows backup and restore smoke tests
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\deploy\windows\tests\backup-restore.smoke.ps1

      - name: Validate Windows TLS fake Docker guards
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $fakeBin = Join-Path $env:RUNNER_TEMP "enterprise-drive-fake-docker"
          New-Item -ItemType Directory -Path $fakeBin -Force | Out-Null
          $env:FAKE_DOCKER_LOG = Join-Path $env:RUNNER_TEMP "enterprise-drive-docker-args.log"
          [System.IO.File]::WriteAllText(
              (Join-Path $fakeBin "docker.cmd"),
              @"
          @echo off
          echo %*>>"%FAKE_DOCKER_LOG%"
          echo %* | findstr /c:"config --format json" >nul && (echo {"name":"enterprise-drive"}& exit /b 0)
          echo %* | findstr /c:"ps --quiet gateway" >nul && (echo fake-gateway& exit /b 0)
          echo %* | findstr /c:"port gateway 8080" >nul && (echo 0.0.0.0:80& exit /b 0)
          echo %* | findstr /c:"port gateway 8443" >nul && (echo 0.0.0.0:443& exit /b 0)
          echo %* | findstr /c:"run --detach --no-deps --service-ports gateway" >nul && (echo fake-bootstrap& exit /b 0)
          echo %* | findstr /c:"inspect --format" >nul && (echo healthy& exit /b 0)
          echo %* | findstr /c:" certonly " >nul && exit /b 9
          echo %* | findstr /c:"-checkend 86400" >nul && (
            findstr /c:"renew --cert-name" "%FAKE_DOCKER_LOG%" >nul || exit /b 7
          )
          exit /b 0
          "@,
              (New-Object System.Text.ASCIIEncoding)
          )
          $env:PATH = "$fakeBin;$env:PATH"

          $env:DRIVE_SERVER_NAME = "drive.example.com"
          $env:DRIVE_STORAGE_SERVER_NAME = "storage.example.com"
          $env:DRIVE_S3_PUBLIC_ENDPOINT_URL = "https://storage.example.com"
          $env:DRIVE_SESSION_COOKIE_SECURE = "true"
          $env:DRIVE_TRUSTED_HOSTS = '["drive.example.com","storage.example.com"]'
          $env:DRIVE_CORS_ORIGINS = '["https://app.example.com"]'
          $env:MINIO_CORS_ALLOWED_ORIGIN = "https://app.example.com"
          $env:DRIVE_SECRET_KEY = "0123456789abcdef0123456789abcdef01234567"
          $env:POSTGRES_PASSWORD = "Postgres-Strong-Secret-2026"
          $env:DRIVE_DATABASE_URL = "postgresql+asyncpg://drive:Postgres-Strong-Secret-2026@postgres:5432/enterprise_drive"
          $env:REDIS_PASSWORD = "Redis-Strong-Secret-2026"
          $env:DRIVE_REDIS_URL = "redis://:Redis-Strong-Secret-2026@redis:6379/0"
          $env:DRIVE_CELERY_BROKER_URL = "redis://:Redis-Strong-Secret-2026@redis:6379/1"
          $env:DRIVE_CELERY_RESULT_BACKEND = "redis://:Redis-Strong-Secret-2026@redis:6379/2"
          $env:MINIO_ROOT_PASSWORD = "Minio-Strong-Secret-2026"
          $env:OPENSEARCH_INITIAL_ADMIN_PASSWORD = "OpenSearch-Strong-Secret-2026"
          $env:DRIVE_ADMIN_PASSWORD = "Admin-Strong-Secret-2026"
          $env:CERTBOT_EMAIL = "ops@contoso.org"

          .\deploy\windows\manage.ps1 config -Tls -EnvFile .env.windows.example -Quiet
          .\deploy\windows\manage.ps1 tls-renew -Tls -EnvFile .env.windows.example
          if (
              -not (
                  Get-Content -LiteralPath $env:FAKE_DOCKER_LOG |
                      Select-String -SimpleMatch "renew --cert-name enterprise-drive"
              )
          ) {
              throw "tls-renew did not target DRIVE_TLS_CERT_NAME"
          }
          if (
              -not (
                  Get-Content -LiteralPath $env:FAKE_DOCKER_LOG |
                      Select-String -SimpleMatch "/etc/letsencrypt/renewal/enterprise-drive.conf"
              )
          ) {
              throw "tls-renew did not verify the Certbot renewal lineage"
          }

          try {
              .\deploy\windows\manage.ps1 tls-init -Tls -EnvFile .env.windows.example
              throw "fake Certbot failure did not reach tls-init"
          }
          catch {
              if ($_.Exception.Message -notlike "*docker compose failed with exit code 9*") {
                  throw
              }
          }
          $fakeDockerCalls = Get-Content -LiteralPath $env:FAKE_DOCKER_LOG
          if (
              -not ($fakeDockerCalls | Select-String -SimpleMatch "stop gateway") -or
              -not ($fakeDockerCalls | Select-String -SimpleMatch "start gateway")
          ) {
              throw "tls-init did not restore the previously running gateway after issuance failure"
          }

          $env:DRIVE_SECRET_KEY = "change-me-use-a-long-random-secret"
          try {
              .\deploy\windows\manage.ps1 config -Tls -EnvFile .env.windows.example -Quiet
              throw "example secret guard did not fail"
          }
          catch {
              if ($_.Exception.Message -notlike "*non-interpolated, non-example value*") {
                  throw
              }
          }

          $env:DRIVE_SECRET_KEY = '0123456789abcdef0123456789abcdef01234567'
          $env:MINIO_ROOT_PASSWORD = '${WEAK_PASSWORD}'
          try {
              .\deploy\windows\manage.ps1 config -Tls -EnvFile .env.windows.example -Quiet
              throw "interpolated secret guard did not fail"
          }
          catch {
              if ($_.Exception.Message -notlike "*non-interpolated, non-example value*") {
                  throw
              }
          }

          $env:MINIO_ROOT_PASSWORD = "Minio-Strong-Secret-2026"
          $env:DRIVE_TRUSTED_HOSTS = '["*","drive.example.com","storage.example.com"]'
          try {
              .\deploy\windows\manage.ps1 config -Tls -EnvFile .env.windows.example -Quiet
              throw "wildcard Trusted Hosts guard did not fail"
          }
          catch {
              if ($_.Exception.Message -notlike "*does not allow wildcard*") {
                  throw
              }
          }

          $env:DRIVE_TRUSTED_HOSTS = '["drive.example.com","storage.example.com"]'
          $env:DRIVE_S3_PUBLIC_ENDPOINT_URL = "https://user:pass@storage.example.com/"
          try {
              .\deploy\windows\manage.ps1 config -Tls -EnvFile .env.windows.example -Quiet
              throw "S3 user info guard did not fail"
          }
          catch {
              if ($_.Exception.Message -notlike "*without user info*") {
                  throw
              }
          }

          $env:DRIVE_S3_PUBLIC_ENDPOINT_URL = "https://storage.example.com"
          $env:MINIO_CORS_ALLOWED_ORIGIN = "https://other.example.com"
          try {
              .\deploy\windows\manage.ps1 config -Tls -EnvFile .env.windows.example -Quiet
              throw "MinIO CORS alignment guard did not fail"
          }
          catch {
              if ($_.Exception.Message -notlike "*must exactly match DRIVE_CORS_ORIGINS*") {
                  throw
              }
          }

          $env:MINIO_CORS_ALLOWED_ORIGIN = "https://app.example.com"
          $env:DRIVE_TLS_GATEWAY_BIND = "127.0.0.1"
          try {
              .\deploy\windows\manage.ps1 config -Tls -EnvFile .env.windows.example -Quiet
              throw "loopback TLS bind guard did not fail"
          }
          catch {
              if ($_.Exception.Message -notlike "*non-loopback IPv4 address*") {
                  throw
              }
          }

          $env:DRIVE_TLS_GATEWAY_BIND = "0.0.0.0"
