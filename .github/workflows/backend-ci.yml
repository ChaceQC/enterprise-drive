name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - "compose.windows.yml"
      - ".env.windows.example"
      - "deploy/windows/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "compose.windows.yml"
      - ".env.windows.example"
      - "deploy/windows/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Start MinIO
        run: |
          docker run -d --name enterprise-drive-ci-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=drive-dev \
            -e MINIO_ROOT_PASSWORD=drive-dev-password \
            minio/minio:latest server /data
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs enterprise-drive-ci-minio
          exit 1

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app

      - name: Pytest
        env:
          DRIVE_RUN_MINIO_TESTS: "1"
          DRIVE_TEST_MINIO_ENDPOINT: "http://127.0.0.1:9000"
          DRIVE_TEST_MINIO_ACCESS_KEY: "drive-dev"
          DRIVE_TEST_MINIO_SECRET_KEY: "drive-dev-password"
          DRIVE_TEST_MINIO_BUCKET: "enterprise-drive-ci"
        run: uv run pytest

      - name: Validate Windows Docker Compose
        working-directory: .
        run: docker compose --env-file .env.windows.example -f compose.windows.yml config --quiet

      - name: Build API and core Worker image
        run: docker build --target runtime --tag enterprise-drive-backend:ci .

      - name: Build Preview Worker image
        run: docker build --target preview --tag enterprise-drive-preview:ci .
