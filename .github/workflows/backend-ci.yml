name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "desktop/**"
      - "compose.windows.yml"
      - ".env.windows.example"
      - "deploy/monitoring/**"
      - "deploy/windows/**"
      - ".github/scripts/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "desktop/**"
      - "compose.windows.yml"
      - ".env.windows.example"
      - "deploy/monitoring/**"
      - "deploy/windows/**"
      - ".github/scripts/**"
      - ".github/workflows/backend-ci.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ format('{0}-{1}-{2}', github.workflow, github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository, github.event_name == 'schedule' && 'scheduled' || github.head_ref || github.ref_name) }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      desktop: ${{ steps.scope.outputs.desktop }}
      installer: ${{ steps.scope.outputs.installer }}
      rust_policy: ${{ steps.scope.outputs.rust_policy }}
      windows: ${{ steps.scope.outputs.windows }}
      minio: ${{ steps.scope.outputs.minio }}
      summary: ${{ steps.scope.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate CI scope router
        run: python -X utf8 .github/scripts/test_ci_scope.py

      - name: Resolve changed CI scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -X utf8 .github/scripts/ci_scope.py \
            --event "${EVENT_NAME}" \
            --before "${BEFORE_SHA}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Publish selected scope
        run: |
          echo "Selected CI scopes: ${{ steps.scope.outputs.summary }}" >> "${GITHUB_STEP_SUMMARY}"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Test OpenAPI breaking-change checker
        if: needs.changes.outputs.backend != 'true'
        run: python -X utf8 scripts/test_check_openapi_breaking.py

      - name: Check OpenAPI backward compatibility
        if: needs.changes.outputs.backend != 'true'
        env:
          OPENAPI_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          python -X utf8 scripts/check_openapi_breaking.py \
            --allow-missing-base

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: OpenAPI archive check
        if: needs.changes.outputs.backend != 'true'
        env:
          UV_FROZEN: "1"
        run: npm run api:archive:check

      - name: OpenAPI generated client check
        run: npm run api:client:check

      - name: Unit tests
        run: npm run test:unit

      - name: Build production Web image
        run: docker build --file Dockerfile --tag enterprise-drive-frontend:ci .

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Playwright E2E
        run: npm run test:e2e

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test OpenAPI breaking-change checker
        working-directory: frontend
        run: python -X utf8 scripts/test_check_openapi_breaking.py

      - name: Check OpenAPI backward compatibility
        working-directory: frontend
        env:
          OPENAPI_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          python -X utf8 scripts/check_openapi_breaking.py \
            --allow-missing-base

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Validate current OpenAPI archive
        env:
          UV_FROZEN: "1"
        run: uv run python ../frontend/scripts/export_openapi.py --check

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Bandit security scan
        run: uv run bandit -r app -ll --skip B101

      - name: Dependency vulnerability audit
        run: uv run pip-audit --local --progress-spinner off

      - name: Mypy
        run: uv run mypy app

      - name: Start PostgreSQL
        run: |
          POSTGRES_IMAGE="$(sed -n 's/^POSTGRES_IMAGE=//p' ../.env.windows.example)"
          test -n "${POSTGRES_IMAGE}"
          docker run -d --name enterprise-drive-ci-postgres \
            -p 15432:5432 \
            -e POSTGRES_DB=enterprise_drive \
            -e POSTGRES_USER=drive \
            -e POSTGRES_PASSWORD=drive-ci-password \
            "${POSTGRES_IMAGE}"
          for _ in {1..60}; do
            if docker exec enterprise-drive-ci-postgres \
              pg_isready -U drive -d enterprise_drive; then
              exit 0
            fi
            sleep 2
          done
          docker logs enterprise-drive-ci-postgres
          exit 1

      - name: Upgrade PostgreSQL schema
        env:
          DRIVE_DATABASE_URL: postgresql+asyncpg://drive:drive-ci-password@127.0.0.1:15432/enterprise_drive
        run: uv run alembic upgrade head

      - name: Start MinIO
        run: |
          MINIO_IMAGE="$(sed -n 's/^MINIO_IMAGE=//p' ../.env.windows.example)"
          test -n "${MINIO_IMAGE}"
          docker run -d --name enterprise-drive-ci-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=drive-dev \
            -e MINIO_ROOT_PASSWORD=drive-dev-password \
            "${MINIO_IMAGE}" server /data
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs enterprise-drive-ci-minio
          exit 1

      - name: Pytest
        env:
          DRIVE_RUN_MINIO_TESTS: "1"
          DRIVE_TEST_MINIO_ENDPOINT: "http://127.0.0.1:9000"
          DRIVE_TEST_MINIO_ACCESS_KEY: "drive-dev"
          DRIVE_TEST_MINIO_SECRET_KEY: "drive-dev-password"
          DRIVE_TEST_MINIO_BUCKET: "enterprise-drive-ci"
          DRIVE_RUN_POSTGRES_TESTS: "1"
          DRIVE_TEST_POSTGRES_URL: postgresql+asyncpg://drive:drive-ci-password@127.0.0.1:15432/enterprise_drive
        run: uv run pytest

      - name: Validate Windows Docker Compose
        working-directory: .
        run: docker compose --profile tls-tools --env-file .env.windows.example -f compose.windows.yml config --quiet

      - name: Validate monitoring profile and configurations
        working-directory: .
        run: |
          set -euo pipefail
          monitoring_config="$(
            docker compose \
              --profile monitoring \
              --env-file .env.windows.example \
              -f compose.windows.yml \
              config --format json
          )"
          for service in prometheus alertmanager grafana; do
            jq -e --arg service "${service}" '
              .services[$service] != null
              and ((.services[$service].ports // []) | length == 0)
              and (.services[$service].networks | has("backend"))
            ' <<<"${monitoring_config}" >/dev/null
          done

          prometheus_image="$(sed -n 's/^PROMETHEUS_IMAGE=//p' .env.windows.example)"
          alertmanager_image="$(sed -n 's/^ALERTMANAGER_IMAGE=//p' .env.windows.example)"
          grafana_image="$(sed -n 's/^GRAFANA_IMAGE=//p' .env.windows.example)"
          test -n "${prometheus_image}"
          test -n "${alertmanager_image}"
          test -n "${grafana_image}"
          docker pull "${prometheus_image}"
          docker pull "${alertmanager_image}"
          docker pull "${grafana_image}"

          docker run --rm --pull never \
            --mount "type=bind,source=${PWD}/deploy/monitoring,target=/workspace,readonly" \
            --entrypoint /bin/sh \
            "${prometheus_image}" \
            -ec '
              command -v wget >/dev/null
              mkdir -p /tmp/prometheus/rules
              cp /workspace/prometheus.yml /tmp/prometheus/prometheus.yml
              cp /workspace/maintenance-alerts.yml /tmp/prometheus/rules/maintenance-alerts.yml
              cp /workspace/platform-alerts.yml /tmp/prometheus/rules/platform-alerts.yml
              sed -i "s#/etc/prometheus/rules#/tmp/prometheus/rules#g" /tmp/prometheus/prometheus.yml
              promtool check config /tmp/prometheus/prometheus.yml
              promtool check rules /tmp/prometheus/rules/maintenance-alerts.yml /tmp/prometheus/rules/platform-alerts.yml
            '

          docker run --rm --pull never \
            --mount "type=bind,source=${PWD}/deploy/monitoring/alertmanager.yml,target=/etc/alertmanager/alertmanager.yml,readonly" \
            --mount "type=bind,source=${PWD}/deploy/monitoring/secrets/alertmanager-webhook-url.example,target=/run/secrets/alertmanager-webhook-url,readonly" \
            --entrypoint /bin/sh \
            "${alertmanager_image}" \
            -ec '
              command -v wget >/dev/null
              amtool check-config /etc/alertmanager/alertmanager.yml
            '

          docker run --rm --pull never \
            --entrypoint /bin/sh \
            "${grafana_image}" \
            -ec 'command -v wget >/dev/null'

          python - <<'PY'
          import json
          from pathlib import Path

          dashboards = sorted(
              Path("deploy/monitoring/grafana/dashboards").glob("*.json")
          )
          assert dashboards, "No Grafana dashboards were found"
          uids: set[str] = set()
          for path in dashboards:
              payload = json.loads(path.read_text(encoding="utf-8"))
              uid = payload.get("uid")
              assert isinstance(uid, str) and uid, path
              assert uid not in uids, f"Duplicate dashboard UID: {uid}"
              assert payload.get("panels"), f"Dashboard has no panels: {path}"
              uids.add(uid)
          PY

      - name: Validate public TLS Compose
        working-directory: .
        env:
          DRIVE_SERVER_NAME: drive.example.com
          DRIVE_STORAGE_SERVER_NAME: storage.example.com
          DRIVE_S3_PUBLIC_ENDPOINT_URL: https://storage.example.com
          DRIVE_SESSION_COOKIE_SECURE: "true"
          DRIVE_TRUSTED_HOSTS: '["drive.example.com","storage.example.com"]'
          DRIVE_CORS_ORIGINS: '["https://drive.example.com"]'
          MINIO_CORS_ALLOWED_ORIGIN: https://drive.example.com
          DRIVE_GATEWAY_TEMPLATE_PATH: ./deploy/windows/nginx/tls.conf.template
          DRIVE_GATEWAY_BIND: 0.0.0.0
          DRIVE_STORAGE_GATEWAY_BIND: 0.0.0.0
          DRIVE_GATEWAY_PORT: "80"
          DRIVE_STORAGE_GATEWAY_PORT: "443"
          DRIVE_GATEWAY_HTTP_CONTAINER_PORT: "8080"
          DRIVE_GATEWAY_SECONDARY_CONTAINER_PORT: "8443"
        run: docker compose --profile tls-tools --env-file .env.windows.example -f compose.windows.yml config --quiet

      - name: Validate Windows Compose backup model
        working-directory: .
        run: |
          set -euo pipefail
          docker compose \
            --profile tls-tools \
            --env-file .env.windows.example \
            -f compose.windows.yml \
            config --format json |
            python -c '
          import json
          import sys

          config = json.load(sys.stdin)
          services = config["services"]
          volumes = config["volumes"]
          project = config["name"]

          port_services = sorted(
              name for name, service in services.items() if service.get("ports")
          )
          assert port_services == ["gateway"], (
              f"Only gateway may publish host ports; found: {port_services}"
          )

          expected_volumes = {
              "postgres-data",
              "redis-data",
              "minio-data",
              "opensearch-data",
              "tls-certificates",
          }
          missing_volumes = sorted(expected_volumes - volumes.keys())
          assert not missing_volumes, (
              f"Missing backup volumes: {missing_volumes}"
          )
          for logical_name in sorted(expected_volumes):
              expected_name = f"{project}_{logical_name}"
              actual_name = volumes[logical_name].get("name")
              assert actual_name == expected_name, (
                  f"Volume {logical_name} resolved to {actual_name}, "
                  f"expected {expected_name}"
              )

          expected_mounts = {
              "postgres-data": {
                  ("postgres", "/var/lib/postgresql/data", False),
              },
              "redis-data": {
                  ("redis", "/data", False),
              },
              "minio-data": {
                  ("minio", "/data", False),
              },
              "opensearch-data": {
                  ("opensearch", "/usr/share/opensearch/data", False),
              },
              "tls-certificates": {
                  ("gateway", "/etc/letsencrypt", True),
                  ("certbot", "/etc/letsencrypt", False),
              },
          }
          for volume_name, expected in expected_mounts.items():
              actual = {
                  (
                      service_name,
                      mount.get("target"),
                      bool(mount.get("read_only", False)),
                  )
                  for service_name, service in services.items()
                  for mount in service.get("volumes", [])
                  if mount.get("type") == "volume"
                  and mount.get("source") == volume_name
              }
              assert actual == expected, (
                  f"Unexpected mounts for {volume_name}: "
                  f"{sorted(actual)}; expected {sorted(expected)}"
              )
          '

      - name: Pull gateway validation images
        working-directory: .
        run: |
          docker pull nginx:1.27-alpine
          docker pull certbot/certbot:v5.6.0

      - name: Validate Nginx gateway templates
        working-directory: .
        run: |
          set -euo pipefail
          tls_volume="enterprise-drive-ci-tls-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "${tls_volume}" >/dev/null
          trap 'docker volume rm -f "${tls_volume}" >/dev/null 2>&1 || true' EXIT

          docker run --rm --pull never \
            --mount "type=volume,source=${tls_volume},target=/etc/letsencrypt" \
            --entrypoint sh \
            certbot/certbot:v5.6.0 \
            -ec 'mkdir -p /etc/letsencrypt/live/enterprise-drive; openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=drive.example.com" -addext "subjectAltName=DNS:drive.example.com,DNS:storage.example.com" -keyout /etc/letsencrypt/live/enterprise-drive/privkey.pem -out /etc/letsencrypt/live/enterprise-drive/fullchain.pem >/dev/null 2>&1'

          docker run --rm --pull never \
            --add-host api:127.0.0.1 \
            --add-host minio:127.0.0.1 \
            --mount "type=bind,source=${PWD}/deploy/windows/nginx/tls.conf.template,target=/etc/nginx/templates/default.conf.template,readonly" \
            --mount "type=volume,source=${tls_volume},target=/etc/letsencrypt,readonly" \
            -e DRIVE_SERVER_NAME=drive.example.com \
            -e DRIVE_STORAGE_SERVER_NAME=storage.example.com \
            -e DRIVE_TLS_CERT_NAME=enterprise-drive \
            -e DRIVE_TLS_HSTS_MAX_AGE=31536000 \
            -e DRIVE_API_MAX_BODY_SIZE=16m \
            -e DRIVE_PROXY_CONNECT_TIMEOUT=10s \
            -e DRIVE_PROXY_READ_TIMEOUT=300s \
            -e DRIVE_PROXY_SEND_TIMEOUT=300s \
            nginx:1.27-alpine nginx -t

          docker run --rm --pull never \
            --mount "type=bind,source=${PWD}/deploy/windows/nginx/acme-bootstrap.conf.template,target=/etc/nginx/templates/default.conf.template,readonly" \
            -e DRIVE_SERVER_NAME=drive.example.com \
            -e DRIVE_STORAGE_SERVER_NAME=storage.example.com \
            nginx:1.27-alpine nginx -t
          test "$(grep -Fc 'location = /gateway-healthz {' deploy/windows/nginx/acme-bootstrap.conf.template)" -eq 2

      - name: Run gateway raw HTTP security smoke
        run: |
          uv run python -X utf8 scripts/smoke_gateway_security_docker.py \
            --image nginx:1.27-alpine \
            --template ../deploy/windows/nginx/default.conf.template

      - name: Build API and core Worker image
        run: docker build --target runtime --tag enterprise-drive-backend:ci .

      - name: Run observability Docker smoke
        run: uv run python scripts/smoke_observability_docker.py --image enterprise-drive-backend:ci

      - name: Build Preview Worker image
        run: docker build --target preview --tag enterprise-drive-preview:ci .

      - name: Stop integration containers
        if: always()
        run: |
          docker rm -f enterprise-drive-ci-minio >/dev/null 2>&1 || true
          docker rm -f enterprise-drive-ci-postgres >/dev/null 2>&1 || true

  rust-desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo registry and git sources
        id: cargo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock', 'desktop/rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Rust format
        run: cargo fmt --all --check
        working-directory: desktop

      - name: Rust tests
        run: cargo test --workspace
        working-directory: desktop

      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
        working-directory: desktop

  rust-dependency-policy:
    needs: changes
    if: needs.changes.outputs.rust_policy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cargo dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          manifest-path: desktop/Cargo.toml
          command: check advisories licenses bans sources
          arguments: --all-features --target x86_64-pc-windows-msvc

  windows-desktop-installer:
    needs:
      - changes
      - rust-desktop
      - rust-dependency-policy
    if: >-
      always() &&
      needs.changes.outputs.installer == 'true' &&
      (
        needs.rust-desktop.result == 'success' ||
        needs.rust-desktop.result == 'skipped'
      ) &&
      (
        needs.rust-dependency-policy.result == 'success' ||
        needs.rust-dependency-policy.result == 'skipped'
      )
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Cargo registry and git cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock', 'desktop/rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache pinned Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/enterprise-drive-tauri-cli
          key: tauri-cli-${{ runner.os }}-2.11.4

      - name: Install pinned Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cliRoot = Join-Path $env:RUNNER_TEMP "enterprise-drive-tauri-cli"
          New-Item -ItemType Directory -Path $cliRoot -Force | Out-Null
          npm.cmd install `
            --global `
            --prefix $cliRoot `
            --no-audit `
            --no-fund `
            "@tauri-apps/cli@2.11.4"
          if (-not (Test-Path (Join-Path $cliRoot "tauri.cmd"))) {
            throw "Pinned Tauri CLI was not installed at $cliRoot."
          }

      - name: Add pinned Tauri CLI to PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cliRoot = Join-Path $env:RUNNER_TEMP "enterprise-drive-tauri-cli"
          if (-not (Test-Path (Join-Path $cliRoot "tauri.cmd"))) {
            throw "Cached Tauri CLI was not found at $cliRoot."
          }
          [System.IO.File]::AppendAllText(
            $env:GITHUB_PATH,
            "$cliRoot`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          & (Join-Path $cliRoot "tauri.cmd") --version

      - name: Prepare desktop signing material
        if: github.event_name == 'push'
        shell: pwsh
        timeout-minutes: 5
        env:
          DRIVE_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.DRIVE_WINDOWS_SIGNING_PFX_BASE64 }}
          DRIVE_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.DRIVE_WINDOWS_SIGNING_PFX_PASSWORD }}
          DRIVE_UPDATE_SIGNING_KEY_BASE64: ${{ secrets.DRIVE_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @(
            "DRIVE_WINDOWS_SIGNING_PFX_BASE64",
            "DRIVE_WINDOWS_SIGNING_PFX_PASSWORD",
            "DRIVE_UPDATE_SIGNING_KEY_BASE64"
          )) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "Missing required GitHub Actions secret: $name"
            }
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "enterprise-drive-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:DRIVE_WINDOWS_SIGNING_PFX_BASE64)
          )
          $pem = Get-Content `
            -Raw `
            -LiteralPath desktop/signing/desktop-code-signing.pem
          $certificateBase64 = $pem `
            -replace "-----BEGIN CERTIFICATE-----", "" `
            -replace "-----END CERTIFICATE-----", "" `
            -replace "\s", ""
          $publicCertificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            [Convert]::FromBase64String($certificateBase64)
          )
          $certificateSha256 = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData(
              $publicCertificate.Export(
                [Security.Cryptography.X509Certificates.X509ContentType]::Cert
              )
            )
          ).ToLowerInvariant()
          if (
            $certificateSha256 -ne
            "765e82aba7bd3276f18eeadddd7b33257a68b7a1ddcdac6d4fc7f7bc639a3ca5"
          ) {
            throw "Desktop signing certificate fingerprint mismatch."
          }
          $metadata = cargo metadata `
            --manifest-path desktop/Cargo.toml `
            --locked `
            --no-deps `
            --format-version 1 | ConvertFrom-Json
          $version = (
            $metadata.packages |
              Where-Object { $_.name -eq "drive-desktop" } |
              Select-Object -First 1
          ).version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Desktop package version could not be resolved."
          }
          "DRIVE_SIGNING_PFX_PATH=$pfxPath" >> $env:GITHUB_ENV
          "DRIVE_SIGNING_CERT_SHA256=$certificateSha256" >> $env:GITHUB_ENV
          "DRIVE_DESKTOP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Prefetch locked desktop crates once
        shell: pwsh
        run: cargo fetch --locked --manifest-path desktop/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build Windows installer
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_NET_OFFLINE: "true"
        with:
          projectPath: desktop/apps/drive-desktop
          tauriScript: tauri
          args: --target x86_64-pc-windows-msvc
          uploadWorkflowArtifacts: false

      - name: Build update signing tools after desktop release build
        if: github.event_name == 'push'
        env:
          CARGO_NET_OFFLINE: "true"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build `
            --locked `
            --release `
            --manifest-path desktop/Cargo.toml `
            --target x86_64-pc-windows-msvc `
            -p drive-update `
            --bin sign-update `
            --bin verify-update

      - name: Sign and verify Windows update artifacts
        if: github.event_name == 'push'
        shell: pwsh
        env:
          DRIVE_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.DRIVE_WINDOWS_SIGNING_PFX_PASSWORD }}
          DRIVE_UPDATE_SIGNING_KEY_BASE64: ${{ secrets.DRIVE_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem `
            -Path desktop/target `
            -Recurse `
            -File `
            -Filter "*-setup.exe" |
            Where-Object { $_.FullName -match "[\\/]bundle[\\/]nsis[\\/]" } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "Tauri NSIS installer was not found."
          }
          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ($null -eq $signtool) {
            $signtool = Get-ChildItem `
              -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Recurse `
              -File `
              -Filter signtool.exe |
              Where-Object { $_.FullName -match "[\\/]x64[\\/]signtool\.exe$" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if ($null -eq $signtool) {
            throw "signtool.exe was not found."
          }
          $signtoolPath = if ($signtool.Source) {
            $signtool.Source
          } else {
            $signtool.FullName
          }
          & $signtoolPath sign `
            /fd SHA256 `
            /f $env:DRIVE_SIGNING_PFX_PATH `
            /p $env:DRIVE_WINDOWS_SIGNING_PFX_PASSWORD `
            $installer.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Authenticode signing failed."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if (
            $signature.SignatureType -ne "Authenticode" -or
            $null -eq $signature.SignerCertificate
          ) {
            throw "Authenticode signature or signer certificate is missing."
          }
          if ($signature.Status -ne "Valid") {
            $expectedUntrustedStatus = (
              $signature.Status -eq "NotTrusted" -or
              (
                $signature.Status -eq "UnknownError" -and
                $signature.StatusMessage -match (
                  "0x800B0109|root certificate|not trusted"
                )
              )
            )
            if (-not $expectedUntrustedStatus) {
              throw (
                "Authenticode integrity verification failed: " +
                "$($signature.Status) $($signature.StatusMessage)"
              )
            }
          }
          $signerSha256 = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData(
              $signature.SignerCertificate.Export(
                [Security.Cryptography.X509Certificates.X509ContentType]::Cert
              )
            )
          ).ToLowerInvariant()
          if ($signerSha256 -ne $env:DRIVE_SIGNING_CERT_SHA256) {
            throw "Signed installer certificate fingerprint mismatch."
          }
          Write-Host (
            "Authenticode integrity and pinned signer fingerprint verified " +
            "(system trust is intentionally not required for the self-signed CI certificate)."
          )

          $artifactDir = Join-Path $PWD "desktop/dist/windows"
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          $signedInstaller = Join-Path $artifactDir $installer.Name
          Copy-Item -LiteralPath $installer.FullName -Destination $signedInstaller -Force
          $packageUrl = (
            "https://github.com/${{ github.repository }}/releases/download/" +
            "v$env:DRIVE_DESKTOP_VERSION/$($installer.Name)"
          )
          $manifestPath = Join-Path $artifactDir "latest.json"
          $updateToolDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "desktop/target/x86_64-pc-windows-msvc/release"
          $signUpdate = Join-Path $updateToolDir "sign-update.exe"
          $verifyUpdate = Join-Path $updateToolDir "verify-update.exe"
          foreach ($tool in @($signUpdate, $verifyUpdate)) {
            if (-not (Test-Path -LiteralPath $tool)) {
              throw "Update signing tool was not built: $tool"
            }
          }
          & $signUpdate `
            --package $signedInstaller `
            --version $env:DRIVE_DESKTOP_VERSION `
            --target x86_64-pc-windows-msvc `
            --url $packageUrl `
            --certificate-sha256 $env:DRIVE_SIGNING_CERT_SHA256 `
            --output $manifestPath
          if ($LASTEXITCODE -ne 0) {
            throw "Update manifest signing failed."
          }
          & $verifyUpdate `
            --manifest $manifestPath `
            --package $signedInstaller `
            --public-key desktop/update-public-key.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Update manifest verification failed."
          }
          Copy-Item `
            -LiteralPath desktop/signing/desktop-code-signing.pem `
            -Destination $artifactDir
          Copy-Item `
            -LiteralPath desktop/update-public-key.txt `
            -Destination $artifactDir

      - name: Upload signed Windows desktop artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-drive-windows-${{ github.sha }}
          path: desktop/dist/windows
          if-no-files-found: error

  minio-image-policy:
    needs: changes
    if: needs.changes.outputs.minio == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      server_image: ${{ steps.images.outputs.server_image }}
      client_image: ${{ steps.images.outputs.client_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify immutable MinIO image references
        id: images
        run: |
          set -euo pipefail
          files=(
            .env.windows.example
            compose.windows.yml
            backend/docker-compose.yml
            .github/workflows/backend-ci.yml
          )
          if grep -En 'minio/(minio|mc):latest([^[:alnum:]_.-]|$)' "${files[@]}"; then
            echo "Mutable MinIO image tag detected." >&2
            exit 1
          fi

          test "$(grep -c '^MINIO_IMAGE=' .env.windows.example)" -eq 1
          test "$(grep -c '^MINIO_MC_IMAGE=' .env.windows.example)" -eq 1
          server_image="$(sed -n 's/^MINIO_IMAGE=//p' .env.windows.example)"
          client_image="$(sed -n 's/^MINIO_MC_IMAGE=//p' .env.windows.example)"
          server_pattern='^minio/minio:RELEASE\.[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z@sha256:[0-9a-f]{64}$'
          client_pattern='^minio/mc:RELEASE\.[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z@sha256:[0-9a-f]{64}$'
          [[ "${server_image}" =~ ${server_pattern} ]]
          [[ "${client_image}" =~ ${client_pattern} ]]

          root_config="$(docker compose --profile tls-tools --env-file .env.windows.example -f compose.windows.yml config --format json)"
          test "$(jq -r '.services.minio.image' <<<"${root_config}")" = "${server_image}"
          test "$(jq -r '.services["minio-init"].image' <<<"${root_config}")" = "${client_image}"
          dev_config="$(docker compose -f backend/docker-compose.yml config --format json)"
          test "$(jq -r '.services.minio.image' <<<"${dev_config}")" = "${server_image}"

          verify_registry_digest() {
            local image="$1"
            local tag_reference="${image%@sha256:*}"
            local expected_digest="${image##*@}"
            local resolved_digest
            resolved_digest="$(
              docker buildx imagetools inspect "${tag_reference}" --format '{{json .Manifest}}' |
                jq -r '.digest'
            )"
            test "${resolved_digest}" = "${expected_digest}"
          }
          verify_registry_digest "${server_image}"
          verify_registry_digest "${client_image}"

          echo "server_image=${server_image}" >>"${GITHUB_OUTPUT}"
          echo "client_image=${client_image}" >>"${GITHUB_OUTPUT}"

  minio-supply-chain:
    needs: minio-image-policy
    if: needs.minio-image-policy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Prepare artifact directory
        run: mkdir -p supply-chain-artifacts

      - name: Generate MinIO server SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ needs.minio-image-policy.outputs.server_image }}
          format: spdx-json
          output-file: supply-chain-artifacts/minio-server.spdx.json
          syft-version: v1.46.0
          dependency-snapshot: false
          upload-artifact: false

      - name: Generate MinIO client SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ needs.minio-image-policy.outputs.client_image }}
          format: spdx-json
          output-file: supply-chain-artifacts/minio-client.spdx.json
          syft-version: v1.46.0
          dependency-snapshot: false
          upload-artifact: false

      - name: Install pinned Grype scanner once
        id: grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          grype-version: v0.115.0

      - name: Generate and gate MinIO vulnerability reports
        env:
          GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
          SERVER_IMAGE: ${{ needs.minio-image-policy.outputs.server_image }}
          CLIENT_IMAGE: ${{ needs.minio-image-policy.outputs.client_image }}
        run: |
          set -euo pipefail
          failures=0

          scan_component() {
            local component="$1"
            local image="$2"
            local sbom="supply-chain-artifacts/minio-${component}.spdx.json"
            local report="supply-chain-artifacts/minio-${component}.grype.json"
            local baseline
            case "${component}" in
              server)
                baseline=$'CVE-2026-10536\nCVE-2026-11856\nCVE-2026-8924\nCVE-2026-8927\nCVE-2026-9079\nGHSA-5cgq-3rg8-m6cv\nGHSA-5cx5-wh4m-82fh\nGHSA-89gr-r52h-f8rx\nGHSA-f5wc-c3c7-36mc\nGHSA-jppx-rxg9-jmrx\nGHSA-jv87-32hw-hh99\nGHSA-p77j-4mvh-x3m3\nGHSA-rm3j-f69w-wqmq\nGHSA-vgwf-h737-ff37\nGHSA-x527-x647-q7gg\nGO-2026-4337'
                ;;
              client)
                baseline=$'GHSA-5cgq-3rg8-m6cv\nGHSA-89gr-r52h-f8rx\nGHSA-f5wc-c3c7-36mc\nGHSA-jppx-rxg9-jmrx\nGHSA-p77j-4mvh-x3m3\nGHSA-rm3j-f69w-wqmq\nGHSA-vgwf-h737-ff37\nGHSA-x527-x647-q7gg\nGO-2026-4337'
                ;;
              *)
                echo "Unknown MinIO component: ${component}" >&2
                return 1
                ;;
            esac

            if ! "${GRYPE_CMD}" \
              --output json \
              --file "${report}" \
              "sbom:${sbom}"; then
              echo "Grype failed for ${component}." >&2
              return 1
            fi

            local baseline_file
            local observed_file
            local new_file
            baseline_file="$(mktemp)" || return 1
            observed_file="$(mktemp)" || {
              rm -f "${baseline_file}"
              return 1
            }
            new_file="$(mktemp)" || {
              rm -f "${baseline_file}" "${observed_file}"
              return 1
            }
            cleanup_component() {
              rm -f "${baseline_file}" "${observed_file}" "${new_file}"
            }
            if ! printf '%s\n' "${baseline}" | LC_ALL=C sort -u >"${baseline_file}"; then
              cleanup_component
              return 1
            fi
            if ! jq -r '
              .matches[]?
              | select(.vulnerability.severity == "Critical")
              | .vulnerability.id
            ' "${report}" | LC_ALL=C sort -u >"${observed_file}"; then
              cleanup_component
              return 1
            fi
            if ! comm -13 "${baseline_file}" "${observed_file}" >"${new_file}"; then
              cleanup_component
              return 1
            fi

            local baseline_count
            local critical_count
            local new_count
            baseline_count="$(wc -l <"${baseline_file}" | tr -d ' ')"
            critical_count="$(wc -l <"${observed_file}" | tr -d ' ')"
            new_count="$(wc -l <"${new_file}" | tr -d ' ')"
            if ! {
              echo "### MinIO ${component} supply-chain scan"
              echo
              echo "- Image: \`${image}\`"
              echo "- SBOM: SPDX JSON generated by Syft v1.46.0"
              echo "- Scanner: Grype v0.115.0"
              echo "- Audited Critical baseline (2026-08-03): ${baseline_count}"
              echo "- Current Critical IDs: ${critical_count}"
              echo "- Newly discovered Critical IDs: ${new_count}"
              echo
              echo "<details><summary>Current Critical vulnerability IDs</summary>"
              echo
              echo '```text'
              cat "${observed_file}"
              echo '```'
              echo "</details>"
            } >>"${GITHUB_STEP_SUMMARY}"; then
              cleanup_component
              return 1
            fi

            if [[ -s "${new_file}" ]]; then
              echo "New Critical vulnerabilities were found for ${component}:" >&2
              cat "${new_file}" >&2 || true
              cleanup_component
              return 1
            fi
            cleanup_component
            return 0
          }

          if ! scan_component server "${SERVER_IMAGE}"; then
            failures=1
          fi
          if ! scan_component client "${CLIENT_IMAGE}"; then
            failures=1
          fi
          exit "${failures}"

      - name: Upload MinIO supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minio-supply-chain
          path: supply-chain-artifacts/
          if-no-files-found: error

  windows-deployment:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Windows PowerShell management entrypoint
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $PowerShellFiles = @(
              Get-ChildItem `
                  -LiteralPath ".\deploy\windows" `
                  -Filter "*.ps1" `
                  -Recurse `
                  -File
          )
          if ($PowerShellFiles.Count -eq 0) {
              throw "No deploy/windows PowerShell files were found"
          }

          foreach ($PowerShellFile in $PowerShellFiles) {
              $Bytes = [System.IO.File]::ReadAllBytes($PowerShellFile.FullName)
              if (
                  $Bytes.Length -ge 3 -and
                  $Bytes[0] -eq 0xEF -and
                  $Bytes[1] -eq 0xBB -and
                  $Bytes[2] -eq 0xBF
              ) {
                  throw "PowerShell file must not use a UTF-8 BOM: $($PowerShellFile.FullName)"
              }
              foreach ($Byte in $Bytes) {
                  if ($Byte -gt 0x7F) {
                      throw "PowerShell file must remain ASCII: $($PowerShellFile.FullName)"
                  }
              }

              $Errors = $null
              $Tokens = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $PowerShellFile.FullName,
                  [ref]$Tokens,
                  [ref]$Errors
              ) | Out-Null
              if ($Errors.Count -gt 0) {
                  $Errors | Format-List
                  throw "PowerShell 5.1 parser validation failed: $($PowerShellFile.FullName)"
              }
          }

      - name: Run Windows backup and restore smoke tests
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\deploy\windows\tests\backup-restore.smoke.ps1

      - name: Run Windows governance smoke tests
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\deploy\windows\tests\governance.smoke.ps1

      - name: Validate Windows TLS fake Docker guards
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $fakeBin = Join-Path $env:RUNNER_TEMP "enterprise-drive-fake-docker"
          New-Item -ItemType Directory -Path $fakeBin -Force | Out-Null
          $env:FAKE_DOCKER_LOG = Join-Path $env:RUNNER_TEMP "enterprise-drive-docker-args.log"
          [System.IO.File]::WriteAllText(
              (Join-Path $fakeBin "docker.cmd"),
              @"
          @echo off
          echo %*>>"%FAKE_DOCKER_LOG%"
          echo %* | findstr /c:"config --format json" >nul && (echo {"name":"enterprise-drive"}& exit /b 0)
          echo %* | findstr /c:"ps --quiet gateway" >nul && (echo fake-gateway& exit /b 0)
          echo %* | findstr /c:"port gateway 8080" >nul && (echo 0.0.0.0:80& exit /b 0)
          echo %* | findstr /c:"port gateway 8443" >nul && (echo 0.0.0.0:443& exit /b 0)
          echo %* | findstr /c:"run --detach --no-deps --pull never --service-ports gateway" >nul && (echo fake-bootstrap& exit /b 0)
          echo %* | findstr /c:"inspect --format" >nul && (echo healthy& exit /b 0)
          echo %* | findstr /c:" certonly " >nul && exit /b 9
          echo %* | findstr /c:"-checkend 86400" >nul && (
            findstr /c:"renew --cert-name" "%FAKE_DOCKER_LOG%" >nul || exit /b 7
          )
          exit /b 0
          "@,
              (New-Object System.Text.ASCIIEncoding)
          )
          $env:PATH = "$fakeBin;$env:PATH"

          $env:DRIVE_SERVER_NAME = "drive.example.com"
          $env:DRIVE_STORAGE_SERVER_NAME = "storage.example.com"
          $env:DRIVE_S3_PUBLIC_ENDPOINT_URL = "https://storage.example.com"
          $env:DRIVE_SESSION_COOKIE_SECURE = "true"
          $env:DRIVE_TRUSTED_HOSTS = '["drive.example.com","storage.example.com"]'
          $env:DRIVE_CORS_ORIGINS = '["https://app.example.com"]'
          $env:MINIO_CORS_ALLOWED_ORIGIN = "https://app.example.com"
          $env:DRIVE_SECRET_KEY = "0123456789abcdef0123456789abcdef01234567"
          $env:POSTGRES_PASSWORD = "Postgres-Strong-Secret-2026"
          $env:DRIVE_DATABASE_URL = "postgresql+asyncpg://drive:Postgres-Strong-Secret-2026@postgres:5432/enterprise_drive"
          $env:REDIS_PASSWORD = "Redis-Strong-Secret-2026"
          $env:DRIVE_REDIS_URL = "redis://:Redis-Strong-Secret-2026@redis:6379/0"
          $env:DRIVE_CELERY_BROKER_URL = "redis://:Redis-Strong-Secret-2026@redis:6379/1"
          $env:DRIVE_CELERY_RESULT_BACKEND = "redis://:Redis-Strong-Secret-2026@redis:6379/2"
          $env:MINIO_ROOT_PASSWORD = "Minio-Strong-Secret-2026"
          $env:OPENSEARCH_INITIAL_ADMIN_PASSWORD = "OpenSearch-Strong-Secret-2026"
          $env:DRIVE_ADMIN_PASSWORD = "Admin-Strong-Secret-2026"
          $env:CERTBOT_EMAIL = "ops@contoso.org"

          .\deploy\windows\manage.ps1 config -Monitoring -EnvFile .env.windows.example -Quiet
          if (
              -not (
                  Get-Content -LiteralPath $env:FAKE_DOCKER_LOG |
                      Select-String -SimpleMatch "--profile monitoring config --quiet"
              )
          ) {
              throw "Monitoring profile was not forwarded to Docker Compose"
          }
          try {
              .\deploy\windows\manage.ps1 backup-retention `
                  -EnvFile .env.windows.example `
                  -BackupDirectory C:\EnterpriseDriveBackups `
                  -Monitoring
              throw "backup-retention accepted the unrelated -Monitoring switch"
          }
          catch {
              if ($_.Exception.Message -notlike "*does not accept -Monitoring*") {
                  throw
              }
          }

          .\deploy\windows\manage.ps1 config -Tls -EnvFile .env.windows.example -Quiet
          .\deploy\windows\manage.ps1 tls-renew -Tls -EnvFile .env.windows.example
          if (
              -not (
                  Get-Content -LiteralPath $env:FAKE_DOCKER_LOG |
                      Select-String -SimpleMatch "renew --cert-name enterprise-drive"
              )
          ) {
              throw "tls-renew did not target DRIVE_TLS_CERT_NAME"
          }
          if (
              -not (
                  Get-Content -LiteralPath $env:FAKE_DOCKER_LOG |
                      Select-String -SimpleMatch "/etc/letsencrypt/renewal/enterprise-drive.conf"
              )
          ) {
              throw "tls-renew did not verify the Certbot renewal lineage"
          }

          try {
              .\deploy\windows\manage.ps1 tls-init -Tls -EnvFile .env.windows.example
              throw "fake Certbot failure did not reach tls-init"
          }
          catch {
              if ($_.Exception.Message -notlike "*docker compose failed with exit code 9*") {
                  throw
              }
          }
          $fakeDockerCalls = Get-Content -LiteralPath $env:FAKE_DOCKER_LOG
          if (
              -not ($fakeDockerCalls | Select-String -SimpleMatch "stop gateway") -or
              -not ($fakeDockerCalls | Select-String -SimpleMatch "start gateway")
          ) {
              throw "tls-init did not restore the previously running gateway after issuance failure"
          }

          $env:DRIVE_SECRET_KEY = "change-me-use-a-long-random-secret"
          try {
              .\deploy\windows\manage.ps1 config -Tls -EnvFile .env.windows.example -Quiet
              throw "example secret guard did not fail"
          }
          catch {
              if ($_.Exception.Message -notlike "*non-interpolated, non-example value*") {
                  throw
              }
          }

          $env:DRIVE_SECRET_KEY = '0123456789abcdef0123456789abcdef01234567'
          $env:MINIO_ROOT_PASSWORD = '${WEAK_PASSWORD}'
          try {
              .\deploy\windows\manage.ps1 config -Tls -EnvFile .env.windows.example -Quiet
              throw "interpolated secret guard did not fail"
          }
          catch {
              if ($_.Exception.Message -notlike "*non-interpolated, non-example value*") {
                  throw
              }
          }

          $env:MINIO_ROOT_PASSWORD = "Minio-Strong-Secret-2026"
          $env:DRIVE_TRUSTED_HOSTS = '["*","drive.example.com","storage.example.com"]'
          try {
              .\deploy\windows\manage.ps1 config -Tls -EnvFile .env.windows.example -Quiet
              throw "wildcard Trusted Hosts guard did not fail"
          }
          catch {
              if ($_.Exception.Message -notlike "*does not allow wildcard*") {
                  throw
              }
          }

          $env:DRIVE_TRUSTED_HOSTS = '["drive.example.com","storage.example.com"]'
          $env:DRIVE_S3_PUBLIC_ENDPOINT_URL = "https://user:pass@storage.example.com/"
          try {
              .\deploy\windows\manage.ps1 config -Tls -EnvFile .env.windows.example -Quiet
              throw "S3 user info guard did not fail"
          }
          catch {
              if ($_.Exception.Message -notlike "*without user info*") {
                  throw
              }
          }

          $env:DRIVE_S3_PUBLIC_ENDPOINT_URL = "https://storage.example.com"
          $env:MINIO_CORS_ALLOWED_ORIGIN = "https://other.example.com"
          try {
              .\deploy\windows\manage.ps1 config -Tls -EnvFile .env.windows.example -Quiet
              throw "MinIO CORS alignment guard did not fail"
          }
          catch {
              if ($_.Exception.Message -notlike "*must exactly match DRIVE_CORS_ORIGINS*") {
                  throw
              }
          }

          $env:MINIO_CORS_ALLOWED_ORIGIN = "https://app.example.com"
          $env:DRIVE_TLS_GATEWAY_BIND = "127.0.0.1"
          try {
              .\deploy\windows\manage.ps1 config -Tls -EnvFile .env.windows.example -Quiet
              throw "loopback TLS bind guard did not fail"
          }
          catch {
